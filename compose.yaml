services:
  api:
    build: .
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
    expose:
      - 8000
    ports:
      - "8000:8000"
    command: ["fastapi", "run", "--port", "8000"]
    depends_on:
      - db
  
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: atozship
      POSTGRES_PASSWORD: strong
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql

  redis: 
    image: redis:8.10
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
  
  celery:
    build: .
    command: ["celery", "-A", "app.worker.tasks", "worker", "--loglevel=info"]
    environment:
      REDIS_HOST: redis

